[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-checklists"
version = "0.1.0"
description = "Aviation-grade checklist generator and runner based on NASA human factors and airline QRH standards"
readme = "README.md"
authors = [{ name = "Eetu" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["checklist", "aviation", "qrh", "productivity", "adhd", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
pilot-checklist = "checklist_cli:main"
pilot-checklists = "checklist_cli:main"

[tool.setuptools]
py-modules = ["checklist_cli"]
package-dir = {"" = "scripts"}
